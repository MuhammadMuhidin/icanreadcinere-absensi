<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Manage News & Leave Balance</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="static/css/upload.css">
</head>
<body>

<div class="background-overlay"></div>

<!-- Dark mode toggle button -->
  <nav class="navbar navbar-light bg-white shadow-sm">
    <div class="container">
      <a href="/" class="navbar-brand fw-bold text-decoration-none">
      🏠 Homepage
      </a>
    </div>
  </nav>

  <div class="container">
    <div class="card shadow upload-card">
      <div class="card-header bg-primary text-white">
        <h5 class="mb-0">Manage News & Leave Balance</h5>
      </div>
      <div class="card-body">
        <form method="POST">
          <div class="mb-3">
            <label class="form-label">Type</label>
            <select name="jenis" class="form-select" required id="jenis">
              <option value="">-- Choose --</option>
              <option value="banner">News / Banner</option>
              <option value="cuti">Leave Balance</option>
            </select>
          </div>
        
          <!-- Banner -->
          <div class="mb-3" id="bannerForm" style="display:none">
            <label class="form-label">Content News</label>
            <textarea name="content" class="form-control" rows="5"></textarea>
          </div>
        
          <!-- Cuti -->
          <div id="cutiForm" style="display:none">
            <div class="mb-3">
              <label class="form-label">Employee Name</label>
              <select name="userid" class="form-select" id="userid">
                <option value="">-- Select Employee --</option>
                <option value="Hanny">Hanny</option>
                <option value="Dini">Dini</option>
                <option value="Mita">Mita</option>
                <option value="Fiya">Fiya</option>
                <option value="Nadhira">Nadhira</option>
                <option value="Immanuel">Immanuel</option>
                <option value="Lintang">Lintang</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Leave Balance</label>
              <input type="number" name="sisa" class="form-control" id="sisa" readonly>
            </div>
          </div>
        
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required>
          </div>
        
          <button type="submit" class="btn btn-primary w-100">💾 Save</button>
        </form>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, msg in messages %}
              <div class="alert alert-{{ 'success' if category == 'success' else 'danger' }} mt-3">
                {{ msg }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}
      </div>
    </div>
  </div>

<script>
const jenis = document.getElementById("jenis");
const banner = document.getElementById("bannerForm");
const cuti = document.getElementById("cutiForm");

jenis.addEventListener("change", () => {
  banner.style.display = jenis.value === "banner" ? "block" : "none";
  cuti.style.display = jenis.value === "cuti" ? "block" : "none";
});
</script>

  <!-- Script Dark Mode -->
  <script>
    const toggle = document.getElementById("darkModeToggle");

    // Apply saved preference
    if (localStorage.getItem("darkMode") === "enabled") {
      document.body.classList.add("dark-mode");
      toggle.textContent = "☀️";
    }

    // Toggle behavior
    toggle.addEventListener("click", () => {
      document.body.classList.toggle("dark-mode");
      const isDark = document.body.classList.contains("dark-mode");

      localStorage.setItem("darkMode", isDark ? "enabled" : "disabled");
      toggle.textContent = isDark ? "☀️" : "🌙";
    });
  </script>
<script>
const selectKaryawan = document.getElementById("nama");
const sisaInput = document.getElementById("sisa");

selectKaryawan.addEventListener("change", () => {
  const userid = selectKaryawan.value;
  sisaInput.value = "";

  if (!userid) return;

  sisaInput.placeholder = "Loading...";

  fetch(`/api/sisa-cuti?userid=${encodeURIComponent(userid)}`)
  .then(res => res.json())
  .then(data => {
    if (data.found === true) {
      sisaInput.value = data.sisa;
      sisaInput.readOnly = false;
      sisaInput.focus();
    } else {
      sisaInput.value = data.message;
      sisaInput.readOnly = true;
    }
  })
  .catch(() => {
    sisaInput.value = "";
    alert("Failed to load leave balance");
  });
});
</script>
</body>
</html>
