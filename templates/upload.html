<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Upload File News/Banner</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="static/css/upload.css">
</head>
<body>

<div class="background-overlay"></div>

<!-- Dark mode toggle button -->
  <nav class="navbar navbar-light bg-white shadow-sm">
    <div class="container">
      <span class="navbar-brand fw-bold">📰 Upload File</span>
    </div>
  </nav>

  <div class="container">
    <div class="card shadow upload-card">
      <div class="card-header bg-primary text-white">
        <h5 class="mb-0">Form Upload File</h5>
      </div>
      <div class="card-body">
        <form method="POST" enctype="multipart/form-data">
          <div class="mb-3">
            <label class="form-label">Jenis Upload</label>
            <select name="jenis" class="form-select" required>
              <option value="">-- Pilih Jenis --</option>
              <option value="banner">Banner (.txt)</option>
              <option value="cuti">Cuti (.csv)</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label" for="fileInput">File Upload</label>
            <input type="file" id="fileInput" name="file" accept=".txt" required class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" required placeholder="Input a password" class="form-control">
          </div>
          <button type="submit" class="btn btn-primary btn-upload w-100">📤 Upload</button>
        </form>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, msg in messages %}
              <div class="alert alert-{{ 'success' if category == 'success' else 'danger' }} mt-3">
                {{ msg }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}
      </div>
    </div>
  </div>

  <script>
    const jenisSelect = document.querySelector('select[name="jenis"]');
    const fileInput = document.querySelector('input[name="file"]');
    const fileLabel = document.querySelector('label[for="fileInput"]');

    jenisSelect.addEventListener('change', function () {
      const jenis = this.value;

      if (jenis === 'banner') {
        fileInput.accept = '.txt';
        fileLabel.textContent = 'File Banner (.txt)';
      } else if (jenis === 'cuti') {
        fileInput.accept = '.csv';
        fileLabel.textContent = 'File Saldo Cuti (.csv)';
      } else {
        fileInput.accept = '';
        fileLabel.textContent = 'File Upload';
      }
    });
  </script>

  <!-- Script Dark Mode -->
  <script>
    const toggle = document.getElementById("darkModeToggle");

    // Apply saved preference
    if (localStorage.getItem("darkMode") === "enabled") {
      document.body.classList.add("dark-mode");
      toggle.textContent = "☀️";
    }

    // Toggle behavior
    toggle.addEventListener("click", () => {
      document.body.classList.toggle("dark-mode");
      const isDark = document.body.classList.contains("dark-mode");

      localStorage.setItem("darkMode", isDark ? "enabled" : "disabled");
      toggle.textContent = isDark ? "☀️" : "🌙";
    });
  </script>
</body>
</html>
