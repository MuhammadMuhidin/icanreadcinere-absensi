<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Manage News & Leave Balance</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="static/css/upload.css">
</head>
<body>

<div class="background-overlay"></div>

<!-- Dark mode toggle button -->
  <nav class="navbar navbar-light bg-white shadow-sm">
    <div class="container">
      <a href="/" class="navbar-brand fw-bold text-decoration-none">
      🛠️ Manage News & Leave Balance
      </a>
    </div>
  </nav>

  <div class="container">
    <div class="card shadow upload-card">
      <div class="card-header bg-primary text-white">
        <h5 class="mb-0">Form Request</h5>
      </div>
      <div class="card-body">
        <form method="POST">
          <div class="mb-3">
            <label class="form-label">Jenis</label>
            <select name="jenis" class="form-select" required id="jenis">
              <option value="">-- Pilih --</option>
              <option value="banner">News / Banner</option>
              <option value="cuti">Saldo Cuti</option>
            </select>
          </div>
        
          <!-- Banner -->
          <div class="mb-3" id="bannerForm" style="display:none">
            <label class="form-label">Konten News</label>
            <textarea name="content" class="form-control" rows="5"></textarea>
          </div>
        
          <!-- Cuti -->
          <div id="cutiForm" style="display:none">
            <div class="mb-3">
              <label class="form-label">Nama</label>
              <input type="text" name="nama" class="form-control">
            </div>
            <div class="mb-3">
              <label class="form-label">Sisa Cuti</label>
              <input type="number" name="sisa" class="form-control">
            </div>
          </div>
        
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required>
          </div>
        
          <button type="submit" class="btn btn-primary w-100">💾 Save</button>
        </form>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, msg in messages %}
              <div class="alert alert-{{ 'success' if category == 'success' else 'danger' }} mt-3">
                {{ msg }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}
      </div>
    </div>
  </div>

<script>
const jenis = document.getElementById("jenis");
const banner = document.getElementById("bannerForm");
const cuti = document.getElementById("cutiForm");

jenis.addEventListener("change", () => {
  banner.style.display = jenis.value === "banner" ? "block" : "none";
  cuti.style.display = jenis.value === "cuti" ? "block" : "none";
});
</script>

  <!-- Script Dark Mode -->
  <script>
    const toggle = document.getElementById("darkModeToggle");

    // Apply saved preference
    if (localStorage.getItem("darkMode") === "enabled") {
      document.body.classList.add("dark-mode");
      toggle.textContent = "☀️";
    }

    // Toggle behavior
    toggle.addEventListener("click", () => {
      document.body.classList.toggle("dark-mode");
      const isDark = document.body.classList.contains("dark-mode");

      localStorage.setItem("darkMode", isDark ? "enabled" : "disabled");
      toggle.textContent = isDark ? "☀️" : "🌙";
    });
  </script>
</body>
</html>
