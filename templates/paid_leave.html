<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Paid Leave</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="static/css/paid_leave.css">
</head>

<body>

<div class="card">
  <div class="header">
    <h1>Paid Leave</h1>
    <div class="header-right">
      <button id="applyBtn" class="btn-primary" onclick="openDialog()">Request</button>
    </div>
  </div>

  <div id="loading" class="loading" style="display:none;">
    Loading…
  </div>

  <table>
    <thead>
      <tr>
        <th>Requested By</th>
        <th>Submitted</th>
        <th>Leave Date</th>
        <th>Status</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="leaveTable"></tbody>
  </table>
</div>

<dialog id="leaveDialog">
  <h3>Request for Leave</h3>
  <input type="date" id="leaveDate">
  <div class="dialog-actions">
    <button class="btn-ghost" onclick="closeDialog()">Cancel</button>
    <button id="submitBtn" class="btn-primary" onclick="submitLeave()">Submit</button>
  </div>
</dialog>

<script>
/* =========================
   DARK MODE (GLOBAL STYLE)
   ========================= */
if (localStorage.getItem("darkMode") === "enabled") {
    document.body.classList.add("dark-mode");
  }
  
/* =========================
   PAID LEAVE LOGIC (UNCHANGED)
   ========================= */
window.SESSION_NAME = "{{ SESSION_NAME }}";

const NAME = window.SESSION_NAME;
const ROLE = (NAME === "Hanny") ? "manager" : "employee";

function openDialog() {
  document.getElementById("leaveDialog").showModal();
}
function closeDialog() {
  document.getElementById("leaveDialog").close();
}

function loadData() {
  document.getElementById("loading").style.display = "block";

  fetch("/leave")
    .then(r => r.json())
    .then(res => {
      let data = res.data;

      if (ROLE === "manager") {
        data = data.filter(d =>
          ["WAITING APPROVAL", "APPROVED", "REJECTED"].includes(d.status) ||
          (d.status === "CANCELED" && d.name === "Hanny")
        );
      } else {
        data = data.filter(d => d.name === NAME);
      }

      data.sort((a, b) => {
        if (a.status === "WAITING APPROVAL" && b.status !== "WAITING APPROVAL") return -1;
        if (a.status !== "WAITING APPROVAL" && b.status === "WAITING APPROVAL") return 1;
        return new Date(b.created_at) - new Date(a.created_at);
      });

      renderTable(data);
    })
    .finally(() => {
      document.getElementById("loading").style.display = "none";
    });
}

function submitLeave() {
  const btn = document.getElementById("submitBtn");
  const leaveDate = document.getElementById("leaveDate").value;
  if (!leaveDate) return alert("Leave date is required");

  btn.disabled = true;

  fetch("/leave", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ leave_date: leaveDate })
  }).then(() => {
    btn.disabled = false;
    closeDialog();
    loadData();
  });
}

function cancelLeave(id) {
  Swal.fire({
    title: "Cancel this request?",
    text: "This action cannot be undone.",
    icon: "warning",
    showCancelButton: true,
    confirmButtonText: "Yes, cancel it",
    cancelButtonText: "Back",
    confirmButtonColor: "#dc2626"
  }).then((result) => {
    if (!result.isConfirmed) return;

    fetch(`/leave/${id}/cancel`, { method: "PATCH" })
      .then(() => {
        Swal.fire({
          icon: "success",
          title: "Canceled",
          timer: 1200,
          showConfirmButton: false
        });
        loadData();
      });
  });
  }

function decision(id, action) {
  const isApprove = action === "APPROVED";

  Swal.fire({
    title: isApprove ? "Approve this request?" : "Confirm Action",
    text: isApprove
      ? "This will approve the leave and deduct balance."
      : "Are you sure?",
    icon: "question",
    showCancelButton: true,
    confirmButtonText: isApprove ? "Yes, approve it" : "Confirm",
    cancelButtonText: "Back",
    confirmButtonColor: "#16a34a"
  }).then((result) => {
    if (!result.isConfirmed) return;

    fetch(`/leave/${id}/decision`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action })
    }).then(() => {
      Swal.fire({
        icon: "success",
        title: "Approved",
        timer: 1200,
        showConfirmButton: false
      });
      loadData();
    });
  });
}

function renderTable(data) {
  const tbody = document.getElementById("leaveTable");
  tbody.innerHTML = "";

  if (!data.length) {
    tbody.innerHTML =
      `<tr><td colspan="5" class="loading">No data available</td></tr>`;
    return;
  }

  data.forEach(l => {
    let action = "-";

    if (l.status === "WAITING APPROVAL") {
  let buttons = [];

  // Pemilik pengajuan (termasuk Hanny) → boleh cancel
  if (l.name === NAME) {
    buttons.push(
      `<button class="btn-danger" onclick="cancelLeave(${l.id})">Cancel</button>`
    );
  }

  // Hanny → boleh approve / reject siapa pun (termasuk diri sendiri)
  if (ROLE === "manager") {
    buttons.push(
      `<button class="btn-danger" onclick="rejectWithReason(${l.id})">Reject</button>`
    );
    buttons.push(
      `<button class="btn-success" onclick="decision(${l.id}, 'APPROVED')">Approve</button>`
    );
  }

  action = buttons.join(" ");
  }

    tbody.innerHTML += `
      <tr>
        <td>
          <div class="label">Requested by</div>
          <span class="name">${l.name}</span>
        </td>
        <td>
          <div class="label">Submitted</div>
          ${l.created_at ? new Date(l.created_at).toISOString()
            .slice(0, 16).replace("T", " ") : "-"}
        </td>
        <td>
          <div class="label">Leave Date</div>
          ${l.leave_date}
        </td>
        <td>
          <div class="label">Status</div>
          <span class="status ${l.status.replace(/\s+/g, '-')}">${l.status}</span>
          ${
            l.status === "REJECTED" && l.reason
            ? `<div style="
            margin-top:6px;
            font-size:12px;
            color: var(--muted);
            line-height:1.4;
            ">
            <strong>Reason:</strong><br>
            ${l.reason}</div>`: ""
          }
        </td>
        <td>
          <div class="label">Action</div>
          <div class="actions">${action}</div>
        </td>
      </tr>
    `;
  });
}

  function rejectWithReason(id) {
  Swal.fire({
    title: "Reject this request?",
    input: "textarea",
    inputLabel: "what's the reason:",
    inputPlaceholder: "Write the reason here...",
    inputAttributes: {
      rows: 4
    },
    showCancelButton: true,
    confirmButtonText: "Yes, reject it",
    confirmButtonColor: "#dc2626",
    cancelButtonText: "Back",
    preConfirm: (value) => {
      if (!value || !value.trim()) {
        Swal.showValidationMessage("Reason is required");
        return false;
      }
      return value.trim();
    }
  }).then((result) => {
    if (!result.isConfirmed) return;

    fetch(`/leave/${id}/decision`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        action: "REJECTED",
        reason: result.value
      })
    }).then(() => loadData());
  });
  }
  
loadData();
</script>

</body>
</html>
