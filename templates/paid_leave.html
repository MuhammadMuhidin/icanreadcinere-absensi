<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Paid Leave</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="static/css/paid_leave.css">
</head>

<body>

<div class="card">
  <div class="header">
    <h1>Paid Leave</h1>
    <div class="header-right">
      <button id="applyBtn" class="btn-primary" onclick="openDialog()">Request</button>
    </div>
  </div>

  <!-- FILTER BAR -->
<div class="filter-bar">
  <div class="tabs">
    <button class="tab active" data-status="ALL">All</button>
    <button class="tab" data-status="WAITING APPROVAL">Waiting</button>
    <button class="tab" data-status="APPROVED">Approved</button>
    <button class="tab" data-status="REJECTED">Rejected</button>
    <button class="tab" data-status="CANCELED">Canceled</button>
  </div>

  <select id="yearFilter">
    <option value="ALL">All Years</option>
  </select>
</div>
  
  <div id="loading" class="loading" style="display:none;">
    Loading…
  </div>

  <table>
    <thead>
      <tr>
        <th>Requested By</th>
        <th>Submitted</th>
        <th>Leave Date</th>
        <th>Status</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="leaveTable"></tbody>
  </table>
</div>

<dialog id="leaveDialog">
  <h3>Request for Leave</h3>
  <input type="date" id="leaveDate">
  <div class="dialog-actions">
    <button class="btn-ghost" onclick="closeDialog()">Cancel</button>
    <button id="submitBtn" class="btn-primary" onclick="submitLeave()">Submit</button>
  </div>
</dialog>

<dialog id="editLeaveDialog">
  <h3>Edit Leave</h3>
  <input type="date" id="editLeaveDate">
  <div class="dialog-actions">
    <button class="btn-ghost" onclick="closeEditDialog()">Cancel</button>
    <button id="editSaveBtn" class="btn-primary" onclick="submitEdit()">
       <span class="btn-text">Save</span>
    </button>
  </div>
</dialog>

<script>
/* =========================
   DARK MODE (GLOBAL STYLE)
   ========================= */
if (localStorage.getItem("darkMode") === "enabled") {
    document.body.classList.add("dark-mode");
  }
  
/* =========================
   PAID LEAVE LOGIC (UNCHANGED)
   ========================= */
window.SESSION_NAME = "{{ SESSION_NAME }}";

const NAME = window.SESSION_NAME;
const ROLE = (NAME === "Hanny") ? "manager" : "employee";
let EDIT_LEAVE_ID = null;

function openEditDialog(id, currentDate) {
  EDIT_LEAVE_ID = id;
  document.getElementById("editLeaveDate").value = currentDate?.slice(0,10) || "";
  document.getElementById("editLeaveDialog").showModal();
}
  
function closeEditDialog() {
  EDIT_LEAVE_ID = null;
  document.getElementById("editLeaveDialog").close();
}
  
function openDialog() {
  document.getElementById("leaveDialog").showModal();
}
  
function closeDialog() {
  document.getElementById("leaveDialog").close();
}

function loadData() {
  document.getElementById("loading").style.display = "block";

  fetch("/leave")
    .then(r => r.json())
    .then(res => {
      let data = res.data;

      if (ROLE === "manager") {
        data = data.filter(d =>
          ["WAITING APPROVAL", "APPROVED", "REJECTED"].includes(d.status) ||
          (d.status === "CANCELED" && d.name === "Hanny")
        );
      } else {
        data = data.filter(d => d.name === NAME);
      }

      data.sort((a, b) => {
        if (a.status === "WAITING APPROVAL" && b.status !== "WAITING APPROVAL") return -1;
        if (a.status !== "WAITING APPROVAL" && b.status === "WAITING APPROVAL") return 1;
        return new Date(b.created_at) - new Date(a.created_at);
      });

      renderTable(data);
    })
    .finally(() => {
      document.getElementById("loading").style.display = "none";
    });
}

/* ================= FILTER STATE ================= */
let ACTIVE_STATUS = "ALL";
let ACTIVE_YEAR = new Date().getFullYear().toString();
let RAW_DATA = [];

/* override ringan tanpa ubah logic */
const originalRenderTable = renderTable;

renderTable = function(data) {
  RAW_DATA = data;
  populateYearFilter(data);
  applyFilter();
};

/* ================= YEAR OPTIONS ================= */
function populateYearFilter(data) {
  const select = document.getElementById("yearFilter");
  if (select.options.length > 1) return;

  const years = [...new Set(
    data
      .filter(d => d.created_at)
      .map(d => new Date(d.created_at).getFullYear())
  )].sort((a,b) => b - a);

  years.forEach(y => {
    const opt = document.createElement("option");
    opt.value = y;
    opt.textContent = y;
    select.appendChild(opt);
  });

  select.value = ACTIVE_YEAR;
}

/* ================= APPLY FILTER ================= */
function applyFilter() {
  let filtered = [...RAW_DATA];

  if (ACTIVE_STATUS !== "ALL") {
    filtered = filtered.filter(d => d.status === ACTIVE_STATUS);
  }

  if (ACTIVE_YEAR !== "ALL") {
    filtered = filtered.filter(d =>
      d.created_at &&
      new Date(d.created_at).getFullYear().toString() === ACTIVE_YEAR
    );
  }

  originalRenderTable(filtered);
}

/* ================= TAB CLICK ================= */
document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");

    ACTIVE_STATUS = tab.dataset.status;
    applyFilter();
  });
});

/* ================= YEAR CHANGE ================= */
document.getElementById("yearFilter").addEventListener("change", e => {
  ACTIVE_YEAR = e.target.value;
  applyFilter();
});
  
function submitLeave() {
  const btn = document.getElementById("submitBtn");
  const leaveDate = document.getElementById("leaveDate").value;

  if (!leaveDate) {
    Swal.fire({
      icon: "warning",
      text: "Leave date is required"
    });
    return;
  }

  btn.disabled = true;

  fetch("/leave", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ leave_date: leaveDate })
  })
  .then(async r => {
    if (!r.ok) {
      const msg = await r.text();
      throw new Error(msg || "Failed to submit");
    }
  })
  .then(() => {
    closeDialog();
    Swal.fire({
      icon: "success",
      title: "Submitted",
      text: "Leave request has been sent",
      timer: 1500,
      showConfirmButton: false
    });

    loadData();
  })
  .catch(err => {
    closeDialog();
    Swal.fire({
      icon: "warning",
      title: "Cannot submit",
      text: err.message
    });
  })
  .finally(() => {
    btn.disabled = false;
  });
}

function cancelLeave(id) {
  Swal.fire({
    title: "Cancel this request?",
    text: "This action cannot be undone.",
    icon: "warning",
    showCancelButton: true,
    confirmButtonText: "Yes, cancel it",
    cancelButtonText: "Back",
    confirmButtonColor: "#dc2626"
  }).then((result) => {
    if (!result.isConfirmed) return;

    fetch(`/leave/${id}/cancel`, { method: "PATCH" })
      .then(() => {
        Swal.fire({
          icon: "success",
          title: "Canceled",
          timer: 1200,
          showConfirmButton: false
        });
        loadData();
      });
  });
  }

function decision(id, action) {
  const isApprove = action === "APPROVED";

  Swal.fire({
    title: isApprove ? "Approve this request?" : "Confirm Action",
    text: isApprove
      ? "This will approve the leave and deduct balance."
      : "Are you sure?",
    icon: "question",
    showCancelButton: true,
    confirmButtonText: isApprove ? "Yes, approve it" : "Confirm",
    cancelButtonText: "Back",
    confirmButtonColor: "#16a34a"
  }).then((result) => {
    if (!result.isConfirmed) return;

    fetch(`/leave/${id}/decision`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action })
    }).then(() => {
      Swal.fire({
        icon: "success",
        title: "Approved",
        timer: 1200,
        showConfirmButton: false
      });
      loadData();
    });
  });
}

function renderStepTimeline(status) {
  const s = status.toLowerCase();

  let activeStep = 0;
  let finalClass = "step-active";
  let finalLabel = "Approved";
  let isWaiting = false;

  // WAITING
  if (s.includes("waiting")) {
    activeStep = 1;
    finalClass = "step-active";
    finalLabel = "Approved";
    isWaiting = true;
  }

  // APPROVED / FINISHED
  if (s === "approved" || s === "finished") {
    activeStep = 2;
    finalClass = "step-success";
    finalLabel = "Approved";
  }

  // REJECTED
  if (s === "rejected") {
    activeStep = 2;
    finalClass = "step-danger";
    finalLabel = "Rejected";
  }

  // CANCELED
  if (s === "canceled") {
    activeStep = 2;
    finalClass = "step-muted";
    finalLabel = "Canceled";
  }

  return `
    <div class="step-timeline">
      <div class="step-line">
        <div class="step-dot step-active"></div>
        
        <div class="step-bar ${
          activeStep >= 1
            ? isWaiting
              ? "step-waiting"
              : finalClass
            : ""
        }"></div>

        <div class="step-dot ${
          isWaiting ? "is-pulsing" : activeStep >= 1 ? finalClass : ""
        }"></div>

        <div class="step-bar ${activeStep >= 2 ? finalClass : ""}"></div>

        <div class="step-dot ${activeStep >= 2 ? finalClass : ""}"></div>
      </div>

      <div class="step-labels">
        <span>Submitted</span>
        <span>Waiting</span>
        <span>${finalLabel}</span>
      </div>
    </div>
  `;
}
  
function renderTable(data) {
  const tbody = document.getElementById("leaveTable");
  tbody.innerHTML = "";

  if (!data.length) {
    tbody.innerHTML =
      `<tr><td colspan="5" class="loading">No data available</td></tr>`;
    return;
  }

  data.forEach(l => {
    let action = "-";

    if (l.status === "WAITING APPROVAL") {
  let buttons = [];

  // EDIT (hanya pemilik request)
  if (l.name === NAME) {
    buttons.push(
      `<button class="btn-warning"
        onclick="openEditDialog(${l.id}, '${l.leave_date}')">
        Edit
      </button>`
    );
  }

  // Pemilik pengajuan (termasuk Hanny) → boleh cancel
  if (l.name === NAME) {
    buttons.push(
      `<button class="btn-danger" onclick="cancelLeave(${l.id})">Cancel</button>`
    );
  }

  // Hanny → boleh approve / reject siapa pun (termasuk diri sendiri)
  if (ROLE === "manager") {
    buttons.push(
      `<button class="btn-danger" onclick="rejectWithReason(${l.id})">Reject</button>`
    );
    buttons.push(
      `<button class="btn-success" onclick="decision(${l.id}, 'APPROVED')">Approve</button>`
    );
  }

  action = buttons.join(" ");
  }

    tbody.innerHTML += `
      <tr class="${l.status.replace(/\s+/g, '-').toLowerCase()}">
        <td>
          <div class="label">Requested by</div>
          <span class="name">${l.name}</span>
        </td>
        <td>
          <div class="label">Submitted</div>
          ${formatDatePretty(l.created_at)}
        </td>
        <td>
          <div class="label">Leave Date</div>
          ${formatDatePretty(l.leave_date)}
        </td>
        <td>
          <div class="label">Status</div>
          <span class="status ${l.status.replace(/\s+/g, '-')}">${l.status}</span>
          ${renderStepTimeline(l.status)}
          ${
            l.status === "REJECTED" && l.reason
            ? `<div style="
            margin-top:6px;
            font-size:12px;
            color: var(--muted);
            line-height:1.4;
            ">
            <strong>Reason:</strong><br>
            ${l.reason}</div>`: ""
          }
        </td>
        <td>
          <div class="label">Action</div>
          <div class="actions">${action}</div>
        </td>
      </tr>
    `;
  });
}

function submitEdit() {
  const newDate = document.getElementById("editLeaveDate").value;
  const btn = document.getElementById("editSaveBtn");

  if (!newDate || !EDIT_LEAVE_ID) return;

  btn.disabled = true;

  fetch(`/leave/${EDIT_LEAVE_ID}`, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ leave_date: newDate })
  })
  .then(r => {
    if (!r.ok) {
      const err = new Error(msg || "Failed");
      err.status = r.status;   // 🔑 SIMPAN STATUS
      throw err;
    }
  })
  .then(() => {
    closeEditDialog();
    setTimeout(() => {
      Swal.fire({
        icon: "success",
        title: "Updated",
        text: "Leave date has been updated",
        timer: 1500,
        showConfirmButton: false
      });
    }, 50);
    loadData();
  })
  .catch(err => {
    closeEditDialog();
    if (err.status === 409) {
      Swal.fire({
        icon: "warning",
        title: "Date unavailable",
        text: err.message
      });
    } else {
      Swal.fire({
        icon: "error",
        title: "Failed",
        text: err.message || "Failed to update leave"
      });
    }
  })
  .finally(() => {
    btn.disabled = false;
  });
}

  function rejectWithReason(id) {
  Swal.fire({
    title: "Reject this request?",
    input: "textarea",
    inputLabel: "what's the reason:",
    inputPlaceholder: "Write the reason here...",
    inputAttributes: {
      rows: 4
    },
    showCancelButton: true,
    confirmButtonText: "Yes, reject it",
    confirmButtonColor: "#dc2626",
    cancelButtonText: "Back",
    preConfirm: (value) => {
      if (!value || !value.trim()) {
        Swal.showValidationMessage("Reason is required");
        return false;
      }
      return value.trim();
    }
  }).then((result) => {
    if (!result.isConfirmed) return;

    fetch(`/leave/${id}/decision`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        action: "REJECTED",
        reason: result.value
      })
    }).then(() => loadData());
  });
  }

  function formatDatePretty(dbDate) {
  if (!dbDate || typeof dbDate !== "string") return "-";

  // Ambil YYYY-MM-DD
  const dateMatch = dbDate.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!dateMatch) return "-";

  const yyyy = dateMatch[1];
  const mm = dateMatch[2];
  const dd = String(Number(dateMatch[3]));

  const months = ["Jan","Feb","Mar","Apr","May","Jun",
                  "Jul","Aug","Sep","Oct","Nov","Dec"];
  const monthName = months[Number(mm) - 1];

  // Ambil HH:MM jika ada
  const timeMatch = dbDate.match(/(\d{2}):(\d{2})/);
  const timePart = timeMatch ? `, ${timeMatch[1]}:${timeMatch[2]}` : "";

  return `${dd} ${monthName} ${yyyy}${timePart}`;
  }
  
loadData();
</script>

</body>
</html>
