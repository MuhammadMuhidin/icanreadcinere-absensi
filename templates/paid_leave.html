<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Paid Leave</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    :root {
      --primary: #2563eb;
      --danger: #dc2626;
      --success: #16a34a;

      --bg: #f5f6fa;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --shadow: rgba(0,0,0,0.05);
    }

    body.dark-mode {
      --bg: #0f172a;
      --card: #111827;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --border: #1f2937;
      --shadow: rgba(0,0,0,0.4);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    h1 {
      margin: 0;
      font-size: 20px;
    }

    /* === CARD === */
    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 10px 25px var(--shadow);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 8px;
    }

    .header-right {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    /* === BUTTONS === */
    button {
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      cursor: pointer;
      transition: transform .05s ease, opacity .2s ease;
      color: #fff;
    }

    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    .btn-primary { background: var(--primary); }
    .btn-danger  { background: var(--danger); }
    .btn-success { background: var(--success); }

    .btn-ghost {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }

    /* === TABLE (MOBILE FIRST) === */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
    }

    thead { display: none; }

    tr { border-bottom: 1px solid var(--border); }

    td {
      padding: 10px 0;
      display: block;
      font-size: 14px;
    }

    .label {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 2px;
    }

    .name {
      font-weight: 600;
    }

    .status {
      font-weight: 600;
    }

    .WAIT    { color: #f59e0b; }
    .ACCEPT  { color: var(--success); }
    .DECLINE { color: var(--danger); }
    .CANCEL  { color: var(--muted); }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    /* === DIALOG === */
    dialog {
      border: none;
      border-radius: 16px;
      padding: 18px;
      width: 90%;
      max-width: 320px;
      background: var(--card);
      color: var(--text);
    }

    dialog::backdrop {
      background: rgba(0,0,0,0.5);
    }

    dialog h3 {
      margin: 0 0 12px 0;
      font-size: 16px;
    }

    dialog input {
      width: 100%;
      padding: 10px;
      font-size: 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      margin-bottom: 14px;
    }

    .dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .loading {
      text-align: center;
      padding: 12px;
      font-size: 14px;
      color: var(--muted);
    }

    @media (min-width: 640px) {
      thead { display: table-header-group; }
      td { display: table-cell; padding: 10px; }
      .label { display: none; }
      .actions { margin-top: 0; }
    }
  </style>
</head>

<body>

<div class="card">
  <div class="header">
    <h1>Paid Leave</h1>
    <div class="header-right">
      <button id="darkModeToggle" class="btn-ghost">🌙</button>
      <button id="applyBtn" class="btn-primary" onclick="openDialog()">Apply</button>
    </div>
  </div>

  <div id="loading" class="loading" style="display:none;">
    Loading…
  </div>

  <table>
    <thead>
      <tr>
        <th>Requested By</th>
        <th>Submitted</th>
        <th>Leave Date</th>
        <th>Status</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="leaveTable"></tbody>
  </table>
</div>

<dialog id="leaveDialog">
  <h3>Apply for Leave</h3>
  <input type="date" id="leaveDate">
  <div class="dialog-actions">
    <button class="btn-ghost" onclick="closeDialog()">Cancel</button>
    <button id="submitBtn" class="btn-primary" onclick="submitLeave()">Submit</button>
  </div>
</dialog>

<script>
/* =========================
   DARK MODE (GLOBAL STYLE)
   ========================= */
const toggle = document.getElementById("darkModeToggle");

if (localStorage.getItem("darkMode") === "enabled") {
  document.body.classList.add("dark-mode");
  toggle.textContent = "☀️";
}

toggle.addEventListener("click", () => {
  document.body.classList.toggle("dark-mode");
  const isDark = document.body.classList.contains("dark-mode");
  localStorage.setItem("darkMode", isDark ? "enabled" : "disabled");
  toggle.textContent = isDark ? "☀️" : "🌙";
});

/* =========================
   PAID LEAVE LOGIC (UNCHANGED)
   ========================= */
window.SESSION_NAME = "{{ SESSION_NAME }}";

const NAME = window.SESSION_NAME;
const ROLE = (NAME === "Hanny") ? "manager" : "employee";

document.getElementById("applyBtn").style.display =
  ROLE === "employee" ? "inline-block" : "none";

function openDialog() {
  document.getElementById("leaveDialog").showModal();
}
function closeDialog() {
  document.getElementById("leaveDialog").close();
}

function loadData() {
  document.getElementById("loading").style.display = "block";

  fetch("/leave")
    .then(r => r.json())
    .then(res => {
      let data = res.data;

      if (ROLE === "manager") {
        data = data.filter(d =>
          ["WAIT", "ACCEPT", "DECLINE"].includes(d.status) ||
          (d.status === "CANCEL" && d.name === "Hanny")
        );
      } else {
        data = data.filter(d => d.name === NAME);
      }

      data.sort((a, b) => {
        if (a.status === "WAIT" && b.status !== "WAIT") return -1;
        if (a.status !== "WAIT" && b.status === "WAIT") return 1;
        return new Date(b.created_at) - new Date(a.created_at);
      });

      renderTable(data);
    })
    .finally(() => {
      document.getElementById("loading").style.display = "none";
    });
}

function submitLeave() {
  const btn = document.getElementById("submitBtn");
  const leaveDate = document.getElementById("leaveDate").value;
  if (!leaveDate) return alert("Leave date is required");

  btn.disabled = true;

  fetch("/leave", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ leave_date: leaveDate })
  }).then(() => {
    btn.disabled = false;
    closeDialog();
    loadData();
  });
}

function cancelLeave(id) {
  if (!confirm("Cancel this leave request?")) return;
  fetch(`/leave/${id}/cancel`, { method: "PATCH" })
    .then(() => loadData());
}

function decision(id, action) {
  if (!confirm(`Confirm ${action}?`)) return;
  fetch(`/leave/${id}/decision`, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ action })
  }).then(() => loadData());
}

function renderTable(data) {
  const tbody = document.getElementById("leaveTable");
  tbody.innerHTML = "";

  if (!data.length) {
    tbody.innerHTML =
      `<tr><td colspan="5" class="loading">No data available</td></tr>`;
    return;
  }

  data.forEach(l => {
    let action = "-";

    if (l.status === "WAIT") {
      if (ROLE === "employee") {
        action = `<button class="btn-danger" onclick="cancelLeave(${l.id})">Cancel</button>`;
      }
      if (ROLE === "manager") {
        action = `
          <button class="btn-success" onclick="decision(${l.id}, 'ACCEPT')">Approve</button>
          <button class="btn-danger" onclick="decision(${l.id}, 'DECLINE')">Reject</button>
        `;
      }
    }

    tbody.innerHTML += `
      <tr>
        <td>
          <div class="label">Requested by</div>
          <span class="name">${l.name}</span>
        </td>
        <td>
          <div class="label">Submitted</div>
          ${l.created_at?.slice(0,10) || "-"}
        </td>
        <td>
          <div class="label">Leave Date</div>
          ${l.leave_date}
        </td>
        <td>
          <div class="label">Status</div>
          <span class="status ${l.status}">${l.status}</span>
        </td>
        <td>
          <div class="label">Action</div>
          <div class="actions">${action}</div>
        </td>
      </tr>
    `;
  });
}

loadData();
</script>

</body>
</html>
